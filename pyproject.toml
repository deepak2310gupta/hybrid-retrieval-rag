[project]
name = "hybrid-retrieval-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "deepak", email = "guptadeepak2310@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "pypdf>=6.19.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
hybrid-retrieval-rag = "hybrid_retrieval_rag:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
